name: Signal Auditor Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "signal_parser.py"
      - "db.py"
      - "report.py"
      - "market_data.py"
      - "tests/**"
      - ".github/workflows/tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Compile Python
        run: python -m compileall -q signal_parser.py db.py report.py market_data.py tests
      - name: Run tests
        env:
          PYTHONPATH: .
        run: pytest -q
