name: Signal Auditor

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */4 * * *"
  push:
    branches: [main]
    paths:
      - "signal_parser.py"
      - "telegram_listener.py"
      - "run.py"
      - "settle.py"
      - "report.py"
      - ".github/workflows/audit.yml"

permissions:
  contents: write   # needed to save data/audit.db back to the repo

concurrency:
  group: signal-auditor
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPORT_TZ: ${{ vars.EXPORT_TZ || 'Africa/Lagos' }}
      SPREAD_PIPS: ${{ vars.SPREAD_PIPS || '1.0' }}
      MAX_HOURS: "72"
      TG_API_ID: ${{ secrets.TG_API_ID }}
      TG_API_HASH: ${{ secrets.TG_API_HASH }}
      TG_CHANNEL: ${{ secrets.TG_CHANNEL }}
      TG_SESSION: ${{ secrets.TG_SESSION }}
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      BOT_CHAT_ID: ${{ secrets.BOT_CHAT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Syntax check
        run: python -m compileall -q .

      - name: Ingest manual signal export
        run: |
          if [ -f signals.txt ]; then
            python run.py ingest signals.txt
          else
            echo "No signals.txt present; continuing with Telegram capture."
          fi

      - name: Pull Telegram signals
        if: ${{ env.TG_API_ID != '' && env.TG_API_HASH != '' && env.TG_CHANNEL != '' && env.TG_SESSION != '' }}
        run: python run.py pull --limit 200

      - name: Settle open signals
        run: python run.py settle

      - name: Build report
        run: |
          mkdir -p data
          python run.py report --csv data/audit-results.csv | tee data/audit-report.txt

      - name: Save audit database
        run: |
          git config user.name "signal-auditor[bot]"
          git config user.email "signal-auditor@users.noreply.github.com"
          git add -f data/audit.db data/audit-results.csv data/audit-report.txt
          if git diff --cached --quiet; then
            echo "No changes to save"
          else
            git commit -m "Update audit data [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Send audit results to MercuryEdge Telegram bot
        if: ${{ env.BOT_TOKEN != '' && env.BOT_CHAT_ID != '' }}
        run: python notify_telegram.py

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: signal-audit-report
          path: |
            data/audit-report.txt
            data/audit-results.csv
          if-no-files-found: warn
          retention-days: 30
