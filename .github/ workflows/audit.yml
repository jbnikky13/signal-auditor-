name: audit
on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:
  push:
    paths: ["signals.txt"]
permissions:
  contents: write
concurrency:
  group: audit
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      EXPORT_TZ: Africa/Lagos
      TG_API_ID: ${{ secrets.TG_API_ID }}
      TG_API_HASH: ${{ secrets.TG_API_HASH }}
      TG_CHANNEL: ${{ secrets.TG_CHANNEL }}
      TG_SESSION: ${{ secrets.TG_SESSION }}
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      BOT_CHAT_ID: ${{ secrets.BOT_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Ingest pasted signals
        run: '[ -f signals.txt ] && python run.py ingest signals.txt || true'
      - name: Pull from Telegram
        if: env.TG_SESSION != ''
        run: python run.py pull
      - name: Settle and report
        run: python run.py daily
      - name: Save data back to the repo
        run: |
          git config user.name "audit-bot"
          git config user.email "audit-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "audit data" && git push)
